name: Keep database awake

# Supabase pauses free-tier projects after 7 days without database activity,
# which takes the demo login down until someone restores it by hand. A query
# every two days keeps it active; a failed run means it paused anyway.
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Postgres through the API
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 60 https://rys-eight.vercel.app/api/v1/health/db; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::Database unreachable - restore the Supabase project"
          exit 1
